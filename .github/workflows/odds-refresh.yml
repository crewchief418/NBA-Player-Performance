name: Refresh NBA sportsbook odds

on:
  schedule:
    # Run the odds importer once overnight at 2 AM America/Denver.
    # The hourly check keeps the schedule aligned with Mountain daylight time.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nba-sportsbook-odds-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Mountain Time overnight window
        id: window
        shell: bash
        run: |
          hour="$(TZ=America/Denver date +%H)"
          if [[ "$hour" == "02" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Refreshing sportsbook odds at $(TZ=America/Denver date '+%Y-%m-%d %H:%M %Z')"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Outside the 2 AM Mountain Time refresh window."
          fi

      - name: Refresh sportsbook odds and injuries
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 2 --retry-all-errors --retry-delay 10 \
            --max-time 90 \
            --request POST \
            "https://nba-player-performance-crewchief418.vercel.app/api/props"
