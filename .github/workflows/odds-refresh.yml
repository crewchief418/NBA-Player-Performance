name: Refresh NBA sportsbook odds

on:
  schedule:
    # Run the lightweight time check hourly; only call the importer at
    # 2 AM, 8 AM, noon, and 4 PM America/Denver.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nba-sportsbook-odds-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Mountain Time refresh window
        id: window
        shell: bash
        run: |
          hour="$(TZ=America/Denver date +%H)"
          if [[ "$hour" == "02" || "$hour" == "08" || "$hour" == "12" || "$hour" == "16" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Refreshing sportsbook odds at $(TZ=America/Denver date '+%Y-%m-%d %H:%M %Z')"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Outside the scheduled Mountain Time refresh windows."
          fi

      - name: Refresh sportsbook odds and injuries
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 2 --retry-all-errors --retry-delay 10 \
            --max-time 90 \
            --request POST \
            "https://nba-player-performance-crewchief418.vercel.app/api/props"
